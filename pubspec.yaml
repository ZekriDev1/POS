name: restropos
description: "CashManager - A modern offline POS management system."
publish_to: 'none'
version: 0.1.2+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  supabase_flutter: ^2.8.4
  mobile_scanner: ^6.0.5
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  intl: ^0.20.2
  pdf: ^3.11.2
  printing: ^5.14.2
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  crypto: ^3.0.6
  package_info_plus: ^8.0.0
  file_picker: ^8.0.0

  # ── Remote Access Server ──
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  shelf_static: ^1.1.3
  web_socket_channel: ^3.0.1
  bcrypt: ^1.1.3
  pointycastle: ^3.9.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14

flutter:
